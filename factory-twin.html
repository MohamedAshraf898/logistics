<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halden Factory Twin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e30613; --red-d:#b8040f; --ink:#1d1f23; --muted:#6b7079; --soft:#9aa0a8;
  --bg:#f2f3f5; --card:#fff; --line:#e8eaed; --chip:#f4f5f7;
  --ok:#22a06b; --warn:#f0a020; --bad:#e5484d; --idle:#8e9bab;
  --font:Inter,'IBM Plex Sans Arabic',system-ui,sans-serif;
}
[dir=ltr]{ --mid:calc(50vw - 117px); }
[dir=rtl]{ --mid:calc(50vw + 117px); --font:'IBM Plex Sans Arabic',Inter,system-ui,sans-serif; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:13px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
canvas#scene{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- top bar ---------- */
#top{position:fixed;top:0;left:0;right:0;height:56px;z-index:20;display:flex;align-items:center;gap:16px;padding:0 16px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;color:var(--red);letter-spacing:-.02em}
.logo span{font-style:italic}
[dir=rtl] .logo span{font-style:normal}
.logo i{width:28px;height:28px;border-radius:7px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:15px;font-style:italic;font-family:Inter,sans-serif}
.plant{font-size:12px;color:var(--muted);font-weight:500;padding-inline-start:14px;border-inline-start:1px solid var(--line);white-space:nowrap}
.kpis{display:flex;gap:6px;margin-inline-start:auto}
.kchip{display:flex;flex-direction:column;padding:5px 11px;border-radius:7px;background:var(--chip);min-width:86px}
.kchip span{font-size:10.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.kchip b{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.kchip.alert{background:#fdecee;cursor:pointer}.kchip.alert b{color:var(--red)}
.clock{display:flex;align-items:center;gap:8px;padding-inline-start:12px;border-inline-start:1px solid var(--line)}
.clock .time{font-weight:700;font-variant-numeric:tabular-nums;min-width:132px;white-space:nowrap}
.seg{display:flex;background:var(--chip);border-radius:7px;padding:3px;direction:ltr}
.seg button{padding:5px 9px;border-radius:5px;font-size:11.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lang{min-width:34px;height:30px;border-radius:7px;background:var(--ink);color:#fff;font-weight:700;font-size:12.5px;padding:0 9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:6px;background:var(--red);color:#fff;font-weight:600;font-size:12px;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--red-d)}
.btn.ghost{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1.4px var(--red)}
.btn.ghost:hover{background:#fff4f4}
.btn.gray{background:var(--chip);color:var(--ink)}
.btn.gray:hover{background:#e9eaed}
.btn.sm{padding:4px 9px;font-size:11px}

/* ---------- side rail ---------- */
#rail{position:fixed;top:68px;inset-inline-start:12px;bottom:12px;width:206px;z-index:15;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);
  border-radius:12px;box-shadow:0 10px 30px -14px rgba(20,22,30,.25);padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
#rail h6{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700;padding:6px 8px 8px}
.mod{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;text-align:start;font-weight:600;font-size:12.5px;transition:background .15s}
.mod:hover{background:var(--chip)}
.mod .n{width:24px;height:24px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none;transition:all .2s}
.mod .badge{margin-inline-start:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;display:grid;place-items:center}
.mod .badge:empty{display:none}
.mod.on{background:#fdecee;color:var(--red)}
.mod.on .n{background:var(--red);color:#fff}
.rail-foot{margin-top:auto;padding:10px 8px 4px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.auto{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:500;cursor:pointer}
.tog{width:30px;height:17px;border-radius:9px;background:#d5d8dd;position:relative;transition:background .2s;flex:none;direction:ltr}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--red)}.tog.on::after{transform:translateX(13px)}

/* ---------- chapter pill ---------- */
#chapter{position:fixed;top:72px;left:var(--mid);transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:9px;background:#fff;
  padding:6px 6px 6px 16px;border-radius:30px;box-shadow:0 8px 24px -10px rgba(0,0,0,.25);font-weight:700;font-size:15px;white-space:nowrap}
[dir=ltr] #chapter{padding:6px 16px 6px 6px}
#chapter .n{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:12.5px}

/* ---------- panel ---------- */
#panel{position:fixed;top:68px;inset-inline-end:12px;bottom:12px;width:440px;z-index:15;background:var(--card);border-radius:12px;
  box-shadow:0 20px 50px -20px rgba(20,22,30,.3);display:flex;flex-direction:column;overflow:hidden}
#panel .head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
#panel .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:7px}
#panel .eyebrow::before{content:"";width:16px;height:2px;background:var(--red)}
#panel h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
#panel .sub{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}
#body{flex:1;overflow:auto;padding:14px 18px 22px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--chip);border-radius:9px;padding:10px 12px}
.tile span{display:block;font-size:11px;color:var(--muted);font-weight:500}
.tile b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tile em{font-style:normal;font-size:11px;font-weight:600}
.ok{color:var(--ok)}.warn{color:#c27c00}.bad{color:var(--bad)}.idle{color:var(--idle)}
.sec{margin-top:18px}
.sec h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h4 small{text-transform:none;letter-spacing:0;font-weight:500;font-size:11px}
.list{display:flex;flex-direction:column;gap:6px}
.rowc{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:9px}
.rowc .main{flex:1;min-width:0}
.rowc .t{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowc .s{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowc.col{flex-direction:column;align-items:stretch}
.rowc .line{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:#e5f5ee}.pill.warn{background:#fdf3e1}.pill.bad{background:#fdecee}.pill.idle{background:#eef1f4}
.bar{height:5px;border-radius:3px;background:#eceef1;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--red)}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t th{text-align:start;font-weight:600;color:var(--soft);font-size:10.5px;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:6px 4px;border-bottom:1px solid #f1f2f4;white-space:nowrap;text-align:start}
table.t td.r,table.t th.r{text-align:end}
.heat{display:grid;gap:3px;font-size:10.5px}
.heat div{height:20px;border-radius:4px;display:grid;place-items:center;color:#fff;font-weight:600}
.heat .lab{background:none;color:var(--ink);justify-items:start;font-weight:600;white-space:nowrap;overflow:hidden;direction:ltr}
[dir=rtl] .heat .lab{justify-items:end}
.heat .hd{background:none;color:var(--soft)}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px}
svg.chart{display:block;width:100%}
[dir=rtl] svg.chart.flip{transform:scaleX(-1)}
.note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}

/* ---------- 3D labels ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:8}
.lab3{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer}
.lab3 .chip{background:#fff;border-radius:14px;padding:4px 9px;font-size:11px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 14px -4px rgba(0,0,0,.22)}
.lab3 .chip i{width:7px;height:7px;border-radius:50%;flex:none}
.lab3 .stem{width:1.5px;height:14px;background:rgba(255,255,255,.9)}
.zone .chip{padding:5px 5px 5px 11px;font-size:12px}
[dir=ltr] .zone .chip{padding:5px 11px 5px 5px}
.zone .chip b{width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:10.5px}
.zone .chip em{font-style:normal;background:var(--red);color:#fff;border-radius:8px;padding:1px 6px;font-size:10px}
.zone .stem{height:34px}
.zone .dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,6,19,.45)}70%{box-shadow:0 0 0 12px rgba(227,6,19,0)}100%{box-shadow:0 0 0 0 rgba(227,6,19,0)}}

/* ---------- morning brief ---------- */
#links{position:fixed;inset:0;z-index:9;pointer-events:none}
#brief{position:fixed;top:118px;left:var(--mid);width:430px;transform:translateX(-50%);z-index:13;background:#1f2329;color:#fff;border-radius:14px;padding:16px 16px 12px;
  box-shadow:0 24px 50px -18px rgba(0,0,0,.45)}
#brief h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
#brief h3 i{width:8px;height:8px;border-radius:50%;background:var(--red)}
#brief .s{font-size:11.5px;color:#a9b0ba;margin:3px 0 10px}
.dec{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:9px;padding:9px 10px;margin-top:6px;cursor:pointer;transition:background .15s}
.dec:hover{background:rgba(255,255,255,.12)}
.dec .ck{width:18px;height:18px;border-radius:50%;border:1.6px solid #6b737e;flex:none;display:grid;place-items:center;font-size:11px}
.dec.done .ck{background:var(--ok);border-color:var(--ok)}
.dec.done .tx{text-decoration:line-through;opacity:.6}
.dec .tx{flex:1;font-size:12.5px;font-weight:600}
.dec .tx small{display:block;font-weight:400;color:#a9b0ba;font-size:11px;margin-top:1px}
.dec .go{font-size:11px;color:#ff8b92;font-weight:600;white-space:nowrap}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{display:flex;align-items:center;gap:9px;background:#1f2329;color:#fff;padding:9px 14px;border-radius:9px;font-size:12px;font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.4);cursor:pointer;max-width:520px}
.toast i{width:8px;height:8px;border-radius:50%;flex:none}

.loader{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .7s}
.loader div{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.loader .b{width:140px;height:3px;background:#e2e4e8;border-radius:2px;overflow:hidden}
.loader .b i{display:block;height:100%;width:40%;background:var(--red);animation:ld 1s infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

@media (max-width:1180px){ .kpis .kchip:nth-child(n+3):not(.alert){display:none} .plant{display:none} }
@media (max-width:900px){
  :root,[dir=ltr],[dir=rtl]{--mid:50%}
  #top{height:52px;gap:8px;padding:0 10px}
  .kpis,.clock .time{display:none}
  .clock{border:0;padding:0;margin-inline-start:auto}
  #rail{top:58px;left:0;right:0;bottom:auto;width:auto;height:50px;flex-direction:row;border-radius:0;padding:6px 8px;overflow-x:auto;gap:4px}
  #rail h6,.rail-foot{display:none}
  .mod{flex:none;padding:6px 10px 6px 6px}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:46vh;border-radius:14px 14px 0 0}
  #chapter{top:116px;font-size:13px}
  #brief{top:156px;width:calc(100vw - 32px)}
  .lab3 .chip{font-size:10px}
  #tourBtn{display:none}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="loader" id="loader"><div><span data-i="loading"></span><span class="b"><i></i></span></div></div>

<header id="top">
  <div class="logo"><i>H</i><span id="brandName"></span></div>
  <div class="plant" id="plantName"></div>
  <div class="kpis">
    <div class="kchip"><span data-i="kOee"></span><b id="kOee">–</b></div>
    <div class="kchip"><span data-i="kCash"></span><b id="kCash">–</b></div>
    <div class="kchip"><span data-i="kDue"></span><b id="kDue">–</b></div>
    <div class="kchip alert" id="kAlertsBox"><span data-i="kAlerts"></span><b id="kAlerts">–</b></div>
  </div>
  <div class="clock">
    <span class="time" id="clock">–</span>
    <div class="seg" id="speed"><button data-s="0">❚❚</button><button data-s="1" class="on">1×</button><button data-s="4">4×</button><button data-s="12">12×</button></div>
    <button class="btn ghost sm" id="tourBtn"></button>
    <button class="lang" id="langBtn" title="Language"></button>
  </div>
</header>

<aside id="rail"><h6 data-i="modules"></h6><div id="mods"></div>
  <div class="rail-foot">
    <div class="auto" id="autoRow"><span class="tog on" id="autoTog"></span><span data-i="autopilot"></span></div>
    <button class="btn gray sm" id="resetBtn" data-i="reset"></button>
  </div>
</aside>

<div id="chapter"><span class="n" id="chN">1</span><span id="chT"></span></div>
<section id="panel"><div class="head"><div class="eyebrow" id="pEy"></div><h2 id="pTitle"></h2><div class="sub" id="pSub"></div></div><div id="body"></div></section>
<div id="labels"></div>
<svg id="links"></svg>
<div id="brief" style="display:none"></div>
<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const CFG = { brand:'Halden', brandAr:'هالدن', plant:'Halden Foods · 10th of Ramadan Plant', plantAr:'هالدن للأغذية · مصنع العاشر من رمضان', currency:'EGP', currencyAr:'ج.م', red:0xe30613 };
const RED=CFG.red;
const COL={ ok:0x22a06b, warn:0xf0a020, bad:0xe5484d, idle:0x9aa7b5, pend:0xd9dde3 };

/* =====================================================================
   LANGUAGE (Arabic / English)
   ===================================================================== */
let LANG = (()=>{ try{ return localStorage.getItem('twin-lang')||'ar'; }catch(e){ return 'ar'; } })();
const AR = () => LANG==='ar';

const T = {

  t_oee:'Plant OEE', t_out24:'Output last 24h', units:'units', t_running:'Lines running', t_scrap:'Scrap rate', lines:'Lines',
  mDownLeft:(m,h)=>`${m} down · ${h}h left`, waitingFor:(it)=>`Waiting for ${it}`, perHour:(a,b,c,d)=>`${a} / ${b} per hour · crew ${c}/${d}`, noWO:'No work order',

  t_fpy:'First-pass yield', t_lotsInsp:'Lots in inspection', t_hold:'On hold', t_ncr:'Open NCRs', incomingLots:'Incoming lots', noLots:'No lots in QC right now. Lots appear here when a purchase order arrives.',
  pareto:'In-process defects · pareto', collecting:'Collecting data…', lineQ:'Line quality (last hour)', th_checks:'Checks', th_result:'Result', inSpec:'In spec', noRun:'No run',
  ncrs:'Non-conformance reports', noNcr:'No open NCRs.', ncrLot:(n,l)=>`${n} · lot ${l}`, raised:'raised',
  // purchasing
  t_openPO:'Open POs', t_late:'Running late', t_customs:'In customs', t_spend:'Committed spend', inbound:'Inbound shipments', import:'import',
  unloaded:'Unloaded, in inspection', eta:'ETA', wasDue:'was due', mrp:'Reorder suggestions (MRP)', itemsN:(n)=>`${n} items`,
  coverLead:(c,l,o)=>`${c}d cover · lead ${l}d · on order ${o}`, nothingReorder:'Nothing to reorder — every item is covered through its lead time.',
  scorecard:'Supplier scorecard', th_sup:'Supplier', th_origin:'Origin', th_lead:'Lead', th_ontime:'On-time',
  // inventory

function toast(text,level='ok',mod){

}

/* =====================================================================
   SIMULATION — one tick = one hour
   ===================================================================== */
const isNight=()=>{ const h=S.h%24; return h>=22||h<6; };
function staffShift(){
  const hr=S.hr, night=isNight();
  Object.keys(hr.plan).forEach(l=>{ const plan=night?Math.round(hr.plan[l]*0.7):hr.plan[l]; hr.present[l]=Math.max(0,plan-(Math.random()<0.45?ri(1,4):0)); });
  hr.otActive=false;
}
function linePlan(id){ return Math.round(S.hr.plan[id]*(isNight()?0.7:1)); }
function staffFactor(l){ return Math.min(1,S.hr.present[l.id]/Math.max(1,linePlan(l.id))); }

function tick(){
  S.h++;
  const hod=S.h%24;
  if(hod===6||hod===14||hod===22){ staffShift(); const low=S.lines.find(l=>staffFactor(l)<0.85);
    event('shiftStart',[hod===6?'A':hod===14?'B':'C',Object.values(S.hr.present).reduce((a,b)=>a+b,0)],'ok','hr'); if(low) event('understaffed',[low.id],'warn','hr'); }

  /* purchasing & importing */
  S.pos.forEach(po=>{
    if(['qc','received','rejected'].includes(po.status)) return;
    if(po.imp && po.progress>=0.8 && po.progress<0.9) po.status='customs';
    else if(po.progress>=0.04) po.status='in transit'; else po.status='ordered';
    const was=po.progress;
    po.progress=Math.min(1,po.progress+rate(po));
    if(po.delayed) po.lateBy=Math.max(po.lateBy, S.h+etaH(po)-po.dueH);
    if(!po.delayed && po.status!=='ordered' && Math.random()<0.003){ po.delayed=true; po.lateBy=ri(18,60); event('poDelayed',[po.id,po.status==='customs',po.sku],'bad','purchasing'); }
    if(was<0.8 && po.progress>=0.8 && po.imp) event('poCustoms',[po.id,po.sku],'warn','purchasing');
    if(po.progress>=1){
      po.status='qc'; po.arrH=S.h;
      const lot={id:'L-'+(seq.lot++), po:po.id, sku:po.sku, qty:po.qty, status:'pending', inH:S.h};
      S.lots.push(lot);
      S.payables.push({id:'INV-'+(seq.inv++), sup:po.sup, amount:po.value, dueH:S.h+24*ri(10,30)});
      event('poArrived',[po.id,lot.id],'ok','qc');
    }
  });

  /* QA / QC */
  S.lots.forEach(l=>{
    if(l.status==='pending' && S.h-l.inH>=3){
      const r=Math.random(); S.qc.inspected++;
      if(r<0.84){ l.status='pass'; l.doneH=S.h; release(l); }
      else if(r<0.95){ l.status='hold'; S.qc.held++; l.r=ri(0,3); S.ncrs.push({id:'NCR-'+(seq.ncr++),lot:l.id,r:l.r,h:S.h}); event('lotHold',[l.id,l.sku,l.r],'warn','qc'); }
      else { l.status='fail'; S.qc.failed++; l.r=4; l.doneH=S.h; S.ncrs.push({id:'NCR-'+(seq.ncr++),lot:l.id,r:4,h:S.h});
        const po=S.pos.find(p=>p.id===l.po); if(po) po.status='rejected'; event('lotRejected',[l.id],'bad','qc'); addPO(l.sku,l.qty); }
    }
  });
  S.lots=S.lots.filter(l=>!((l.status==='pass'||l.status==='fail') && S.h-l.doneH>4));

  /* manufacturing */
  let plantOut=0;
  S.lines.forEach(l=>{
    if(l.down>0){ l.down--; if(l.down===0){ l.downM=-1; event('lineUp',[l.id],'ok','manufacturing'); } }
    if(l.down===0 && !l.paused && Math.random()<0.012){ l.down=ri(2,6); l.downM=ri(0,3); event('machineDown',[l.id,l.downM,l.down],'bad','manufacturing'); }
    let units=0; l.short=null;
    if(l.paused) l.status='idle';
    else if(l.down>0) l.status='down';
    else{
      units=Math.round(l.rate*staffFactor(l)*(S.hr.otActive?1.05:1)*rnd(0.92,1.03));
      const bom=PRODUCTS[l.product].bom;
      for(const sku in bom){ const can=Math.floor(item(sku).onHand/bom[sku]); if(can<units){ units=Math.max(0,can); l.short=sku; } }
      for(const sku in bom) item(sku).onHand=Math.max(0,item(sku).onHand-units*bom[sku]);
      if(units<l.rate*0.25){ if(l.status!=='starved') event('lineStopped',[l.id,l.short],'bad','manufacturing'); l.status='starved'; }
      else l.status = units<l.rate*0.9 ? 'slow':'run';
      const scrap=Math.round(units*rnd(0.005,0.03)); S.qc.units+=units; S.qc.scrap+=scrap;
      if(scrap){ const d=ri(0,DEFECTS.length-1); S.qc.pareto[d]=(S.qc.pareto[d]||0)+scrap; }
      units-=scrap;
      S.fg[l.product].onHand+=units;
      if(l.wo){ l.wo.done+=units; if(l.wo.done>=l.wo.qty){ l.wo.status='done'; l.wo.doneH=S.h; const nx=S.wos.find(w=>w.line===l.id&&w.status==='queued'); if(nx){nx.status='running'; l.wo=nx;} newWO(l,true); } }
    }
    l.out.push(units); if(l.out.length>24) l.out.shift();
    plantOut+=units;
  });
  S.hist.out.push(plantOut); if(S.hist.out.length>24) S.hist.out.shift();
  S.wos=S.wos.filter(w=>w.status!=='done'||S.h-w.doneH<24);

  /* sales */
  if(Math.random()<0.32){ const o=newOrder(); event('newOrder',[o.id,o.c,num(o.qty),o.sku],'ok','sales'); }
  if(S.auto) S.orders.filter(o=>o.status==='new'||o.status==='backorder').sort((a,b)=>a.dueH-b.dueH).forEach(o=>allocate(o,true));

  /* logistics */
  if(S.auto && hod%3===0) S.orders.filter(o=>o.status==='ready').slice(0,trucksFree()).forEach(o=>dispatch(o));
  S.ships.forEach(sh=>{
    if(sh.status!=='en route') return;

    if(sh.progress>=1){
      sh.status='delivered'; sh.delH=S.h; const o=S.orders.find(o=>o.id===sh.order); o.status='delivered'; o.delH=S.h;

  });
  S.ships=S.ships.filter(s=>s.status!=='delivered'||S.h-s.delH<12);
  S.orders=S.orders.filter(o=>o.status!=='delivered'||S.h-o.delH<48);

  /* finance */
  const present=Object.values(S.hr.present).reduce((a,b)=>a+b,0)+20;
  const labor=present*S.hr.wage*(S.hr.otActive?1.25:1); S.fin.cash-=labor; S.fin.laborMTD+=labor;
  S.fin.cash-=3200; S.fin.ohMTD+=3200;
  S.receivables.forEach(r=>{ if(!r.paid && S.h>=r.dueH-12 && Math.random()<(r.rem?0.2:0.06)){ r.paid=true; S.fin.cash+=r.amount; event('paid',[r.c,r.amount],'ok','finance'); } });
  S.receivables=S.receivables.filter(r=>!r.paid);
  S.payables.forEach(p=>{ if(!p.paid && S.h>p.dueH+48) pay(p,true); });
  S.payables=S.payables.filter(p=>!p.paid);
  if(hod===0){ S.fin.cashHist.push(S.fin.cash); if(S.fin.cashHist.length>30) S.fin.cashHist.shift();

  if(S.auto) suggestions().filter(s=>s.critical && !s.ordered).forEach(s=>{ const po=addPO(s.sku,s.qty); event('autoPO',[po.id,s.sku,cover(s.sku).toFixed(1)],'warn','purchasing'); });

}

/* actions */
function release(l){ item(l.sku).onHand+=l.qty; const po=S.pos.find(p=>p.id===l.po); if(po) po.status='received'; S.qc.passed++; }
function allocate(o,silent){
  const fg=S.fg[o.sku];
  if(fg.onHand>=o.qty){ fg.onHand-=o.qty; o.status='ready'; if(!silent) event('allocated',[o.id],'ok','sales'); return true; }
  if(o.status!=='backorder'){ o.status='backorder'; if(!silent) event('backordered',[o.id,o.sku],'warn','sales'); }
  return false;
}
const FLEET=6;
function trucksFree(){ return FLEET-S.ships.filter(s=>s.status==='en route').length; }
function dispatch(o){
  if(trucksFree()<=0){ toast(t('noTrucks'),'warn','logistics'); return; }
  o.status='shipped';
  const sh={id:'SH-'+(seq.sh++), order:o.id, c:o.c, region:o.region, progress:0, transit:ri(6,14), status:'en route', truck:'TR-'+ri(10,16)};
  S.ships.push(sh); event('dispatched',[o.id,o.c,sh.truck],'ok','logistics');
}
function pay(p,auto){ p.paid=true; S.fin.cash-=p.amount; event('paySup',[!!auto,p.sup,p.amount],auto?'warn':'ok','finance'); }
function suggestions(){
  return S.items.filter(i=>!i.dead).map(i=>{
    const u=dailyUse(i.sku), lead=SUPPLIERS[i.sup].lead, rop=u*(lead+2), pos=i.onHand+onOrder(i.sku);

  }).filter(s=>s.need);
}

function sync3D(){

    const s=invSlots[it.sku]; if(!s) return;

    if(it.onHand<=0) fill=0;
    const n=Math.ceil(fill*12); s.boxes.forEach((b,i)=>b.visible=i<Math.max(n, it.onHand>0?1:0));
  });
  Object.keys(PRODUCTS).forEach(sku=>{
    const s=fgSlots[sku]; const on=S.fg[sku].onHand; const open=S.orders.filter(o=>o.sku===sku&&(o.status==='new'||o.status==='backorder')).reduce((a,o)=>a+o.qty,0);
    s.mat.color.setHex(COL[on<open?'bad': on<open*1.5+2000?'warn':'ok']);
    const n=Math.ceil(Math.min(1,on/12000)*24); s.boxes.forEach((b,i)=>b.visible=i<n);
  });
  const active=S.lots.slice(-12);
  qcSlots.forEach((s,i)=>{ const l=active[i]; s.g.visible=!!l; s.lot=l; if(l) s.mat.color.setHex(l.status==='pending'?COL.pend:l.status==='hold'?COL.warn:l.status==='fail'?COL.bad:COL.ok); });
  S.lines.forEach((l,li)=>{
    lineVis[li].ms.forEach((m,mi)=>{
      let c=COL.ok;
      if(l.status==='idle') c=COL.idle;
      else if(l.status==='down') c= mi===l.downM?COL.bad:COL.idle;
      else if(l.status==='starved') c=COL.bad;
      else if(l.status==='slow') c=COL.warn;
      m.light.color.setHex(c); m.blink=(l.status==='down'&&mi===l.downM)||l.status==='starved';
    });
  });
  const impLate=S.pos.some(p=>p.imp&&p.delayed&&['in transit','customs'].includes(p.status));
  const locLate=S.pos.some(p=>!p.imp&&p.delayed&&['in transit','ordered'].includes(p.status));
  impMat.color.setHex(impLate?COL.bad:COL.ok); locMat.color.setHex(locLate?COL.bad:COL.ok);
  customsMat.color.setHex(S.pos.some(p=>p.status==='customs')?(S.pos.some(p=>p.status==='customs'&&p.delayed)?COL.bad:COL.warn):COL.ok);
  const lateShip=r=>S.ships.some(s=>s.region===r&&s.status==='en route'&&S.h+Math.ceil((1-s.progress)*s.transit)>S.orders.find(o=>o.id===s.order).dueH);
  eastMat.color.setHex(lateShip('east')?COL.bad:COL.ok); southMat.color.setHex(lateShip('south')?COL.bad:COL.ok);
  const live=new Set();
  S.pos.filter(p=>['ordered','in transit','customs'].includes(p.status)&&p.progress>=0.04).forEach(p=>{ live.add(p.id); if(!inTrucks[p.id]){ const tk=truck(p.imp?0x3d6f9a:0x7b8590,false); tk.userData={d:-1,ang:0}; inTrucks[p.id]=tk; } });
  Object.keys(inTrucks).forEach(id=>{ if(!live.has(id)){ scene.remove(inTrucks[id]); delete inTrucks[id]; } });
  const ready=S.orders.filter(o=>o.status==='ready').length; dockTrucks.forEach((tk,i)=>tk.visible=i<ready);
  const liveS=new Set();
  S.ships.filter(s=>s.status==='en route').forEach(s=>{ liveS.add(s.id); if(!outTrucks[s.id]){ const tk=truck(); tk.userData={d:-1,ang:0}; outTrucks[s.id]=tk; } });
  Object.keys(outTrucks).forEach(id=>{ if(!liveS.has(id)){ scene.remove(outTrucks[id]); delete outTrucks[id]; } });
}
function poDist(p){
  const path=p.imp?impPath:locPath;
  if(!p.imp) return {path,d:p.progress*path.total};
  const cd=CUSTOMS_X-(-320); let d;
  if(p.progress<0.8) d=p.progress/0.8*cd;
  else if(p.progress<0.9) d=cd-4-(S.pos.filter(q=>q.status==='customs').indexOf(p))*10;

  const pend=S.lots.filter(l=>l.status==='pending'), hold=S.lots.filter(l=>l.status==='hold');
  const par=Object.entries(S.qc.pareto).sort((a,b)=>b[1]-a[1]);
  return `<div class="grid4">${tile(t('t_fpy'),fpy.toFixed(1)+'%',null,fpy>97?'ok':'warn')}${tile(t('t_lotsInsp'),pend.length)}${tile(t('t_hold'),hold.length,null,hold.length?'warn':'ok')}${tile(t('t_ncr'),S.ncrs.length,null,S.ncrs.length?'warn':'')}</div>
  <div class="sec"><h4>${t('incomingLots')}</h4><div class="list">${S.lots.length?S.lots.slice().reverse().map(l=>`<div class="rowc"><div class="main"><div class="t">${bdi(l.id)} · ${iname(l.sku)}</div><div class="s">${bdi(l.po)} · ${num(l.qty)} ${uom(l.sku)} · ${sname(item(l.sku).sup)}${l.r!=null?' · '+reason(l.r):''}</div></div>
    ${l.status==='pending'?pill(t('inspecting'),'idle')+btn(t('b_inspect'),'inspect',l.id,'gray'):l.status==='hold'?btn(t('b_release'),'release',l.id)+btn(t('b_reject'),'reject',l.id,'ghost'):l.status==='pass'?pill(t('passed'),'ok'):pill(t('rejected'),'bad')}</div>`).join(''):`<div class="note">${t('noLots')}</div>`}</div></div>

  <div class="sec"><h4>${t('lineQ')}</h4><table class="t"><tr><th>${t('th_line')}</th><th>${t('th_product')}</th><th class="r">${t('th_checks')}</th><th>${t('th_result')}</th></tr>${S.lines.map(l=>{ const on=l.status==='run'||l.status==='slow'; return `<tr><td>${lshort(l.id)}</td><td>${pname(l.product)}</td><td class="r">${on?12:0}</td><td>${on?pill(t('inSpec'),'ok'):pill(t('noRun'),'idle')}</td></tr>`; }).join('')}</table></div>

},
purchasing(){
  const open=S.pos.filter(p=>!['received','rejected'].includes(p.status));
  const late=open.filter(p=>p.delayed), cus=open.filter(p=>p.status==='customs');
  const spend=S.pos.filter(p=>p.createdH>S.h-24*30).reduce((a,p)=>a+p.value,0);
  const sug=suggestions();
  return `<div class="grid4">${tile(t('t_openPO'),open.length)}${tile(t('t_late'),late.length,null,late.length?'bad':'ok')}${tile(t('t_customs'),cus.length,null,cus.length?'warn':'')}${tile(t('t_spend'),money(spend))}</div>
  <div class="sec"><h4>${t('inbound')}</h4><div class="list">${open.sort((a,b)=>(b.delayed-a.delayed)||(b.progress-a.progress)).map(p=>{
    const st=p.status==='qc'?[t('atQC'),'idle']:p.delayed?[t('lateD',Math.max(1,Math.round(p.lateBy/24))),'bad']:p.status==='customs'?[t('customs'),'warn']:p.status==='ordered'?[t('ordered'),'idle']:[t('onTime'),'ok'];
    const s=SUPPLIERS[p.sup];
    return `<div class="rowc col"><div class="line"><div class="main"><div class="t">${bdi(p.id)} · ${iname(p.sku)}</div><div class="s">${sname(p.sup)} (${s.country})${p.imp?' · '+t('import'):''} · ${num(p.qty)} ${uom(p.sku)} · ${money(p.value)}</div></div>${pill(st[0],st[1])}</div>

},
inventory(){
  const val=S.items.reduce((a,i)=>a+i.onHand*i.cost,0);
  const low=S.items.filter(i=>['bad','warn'].includes(health(i)));
  const dead=S.items.filter(i=>i.dead).reduce((a,i)=>a+i.onHand*i.cost,0);
  const weeks=6;
  const heat=S.items.filter(i=>!i.dead).map(i=>{ const u=dailyUse(i.sku); let on=i.onHand; const cells=[];
    for(let w=0;w<weeks;w++){ const end=S.h+(w+1)*168; on+=S.pos.filter(p=>p.sku===i.sku&&!['received','rejected'].includes(p.status)&&S.h+etaH(p)<=end&&S.h+etaH(p)>end-168).reduce((a,p)=>a+p.qty,0); on-=u*7; const c=on/Math.max(1,u); cells.push(on<=0?'bad':c<5?'warn':'ok'); }
    return {i,cells}; });
  const order={bad:0,warn:1,idle:2,ok:3};
  return `<div class="grid4">${tile(t('t_invVal'),money(val))}${tile(t('t_below'),low.length,null,low.length?'warn':'ok')}${tile(t('t_idleMoney'),money(dead),null,dead?'idle':'')}${tile(t('t_items'),S.items.length)}</div>
  <div class="sec"><h4>${t('heatT')}</h4>
  <div class="heat" style="grid-template-columns:90px repeat(${weeks},1fr)"><div class="hd"></div>${Array.from({length:weeks},(_,w)=>`<div class="hd">${t('wk')}${Math.floor(S.h/168)+w+1}</div>`).join('')}
  ${heat.map(r=>`<div class="lab">${r.i.sku}</div>${r.cells.map(c=>`<div style="background:${HEX[c]}"></div>`).join('')}`).join('')}</div>
  <div class="legend"><span><i style="background:${HEX.ok}"></i>${t('lg_cov')}</span><span><i style="background:${HEX.warn}"></i>${t('lg_low')}</span><span><i style="background:${HEX.bad}"></i>${t('lg_out')}</span><span><i style="background:${HEX.idle}"></i>${t('lg_idle')}</span></div></div>
  <div class="sec"><h4>${t('stockList')}</h4><div class="list">${S.items.slice().sort((a,b)=>order[health(a)]-order[health(b)]).map(i=>{ const h=health(i), c=cover(i.sku);
    return `<div class="rowc"><div class="main"><div class="t">${bdi(i.sku)} · ${L_(i)}</div><div class="s">${num(i.onHand)} ${uom(i.sku)} · ${money(i.onHand*i.cost)}${i.dead?' · '+t('noDemand'):` · ${c===Infinity?'—':t('daysCover',c.toFixed(1))} · ${t('onOrderX',num(onOrder(i.sku)))}`}</div></div>
    ${h==='idle'?(i.onHand>0?btn(t('b_surplus'),'liquidate',i.sku,'gray'):pill(t('cleared'),'ok')):h==='ok'?pill(t('healthy'),'ok'):(onOrder(i.sku)?pill(h==='bad'?t('critPO'):t('lowPO'),h):btn(t('b_reorder'),'createPO',i.sku))}</div>`; }).join('')}</div></div>
  <div class="sec"><h4>${t('fg')}</h4><table class="t"><tr><th>${t('th_product')}</th><th class="r">${t('th_onhand')}</th><th class="r">${t('th_openOrders')}</th><th class="r">${t('th_value')}</th></tr>${Object.keys(PRODUCTS).map(s=>{ const op=S.orders.filter(o=>o.sku===s&&['new','backorder'].includes(o.status)).reduce((a,o)=>a+o.qty,0); return `<tr><td>${pname(s)}</td><td class="r">${num(S.fg[s].onHand)}</td><td class="r ${op>S.fg[s].onHand?'bad':''}">${num(op)}</td><td class="r">${money(S.fg[s].onHand*PRODUCTS[s].price*0.6)}</td></tr>`; }).join('')}</table></div>`;

sales(){
  const open=S.orders.filter(o=>o.status!=='delivered');
  const backlog=open.reduce((a,o)=>a+o.value,0);
  const del=S.orders.filter(o=>o.status==='delivered'); const otif=del.length?Math.round(del.filter(o=>o.delH<=o.dueH).length/del.length*100):96;
  const d=S.hist.demand; const avg=d.slice(-7).reduce((a,b)=>a+b,0)/Math.min(7,d.length); const trend=(d[d.length-1]-d[Math.max(0,d.length-8)])/7;
  const fc=Array.from({length:8},(_,i)=>Math.round(avg+trend*i*0.5));
  return `<div class="grid4">${tile(t('t_rev'),money(S.fin.revMTD))}${tile(t('t_openOrd'),open.length)}${tile(t('t_backlog'),money(backlog))}${tile(t('t_otif'),otif+'%',null,otif>=95?'ok':'warn')}</div>

hr(){

function downloadCSV(kind){
  const A=AR(); let rows=[];
  if(kind==='production') rows=[A?['الخط','المنتج','الحالة','المعدل/س','آخر ساعة','أمر التشغيل','المنجز','الكمية']:['Line','Product','Status','Rate/h','Last hour','WO','WO done','WO qty'],...S.lines.map(l=>[lname(l.id),pname(l.product),t('st_'+l.status),l.rate,l.out[l.out.length-1]||0,l.wo?.id,l.wo?.done,l.wo?.qty])];
  if(kind==='inventory') rows=[A?['الكود','الصنف','المتاح','الوحدة','تكلفة الوحدة','القيمة','أيام التغطية','مطلوب','الحالة']:['SKU','Item','On hand','UoM','Unit cost','Value','Days cover','On order','Status'],...S.items.map(i=>[i.sku,L_(i),Math.round(i.onHand),uom(i.sku),i.cost,Math.round(i.onHand*i.cost),cover(i.sku)===Infinity?'':cover(i.sku).toFixed(1),onOrder(i.sku),health(i)])];
  if(kind==='suppliers') rows=[A?['أمر الشراء','المورد','الصنف','الكمية','القيمة','الحالة','متأخر','ساعات للوصول']:['PO','Supplier','Item','Qty','Value','Status','Delayed','ETA hours'],...S.pos.map(p=>[p.id,sname(p.sup),iname(p.sku),p.qty,Math.round(p.value),p.status,p.delayed,etaH(p)])];
  if(kind==='sales') rows=[A?['الطلب','العميل','المنتج','الكمية','القيمة','الحالة','الاستحقاق']:['Order','Customer','Product','Qty','Value','Status','Due'],...S.orders.map(o=>[o.id,cname(o.c),pname(o.sku),o.qty,o.value,t('so_'+o.status),clockStr(o.dueH)])];
  if(kind==='finance') rows=[A?['البند','المبلغ']:['Line','Amount'],[t('t_cash'),Math.round(S.fin.cash)],[t('pl_rev'),Math.round(S.fin.revMTD)],[t('pl_cogs'),Math.round(S.fin.cogsMTD)],[t('pl_lab'),Math.round(S.fin.laborMTD)],[t('pl_oh'),Math.round(S.fin.ohMTD)],[t('t_ar'),Math.round(S.receivables.reduce((a,r)=>a+r.amount,0))],[t('t_ap'),Math.round(S.payables.reduce((a,p)=>a+p.amount,0))]];
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');   // BOM so Excel opens Arabic correctly
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=`${CFG.brand.toLowerCase()}-${kind}-day${Math.floor(S.h/24)+1}.csv`; a.click();
}

/* =====================================================================
   UI WIRING
   ===================================================================== */
const modsEl=document.getElementById('mods');
let current=MODULES[0];
const bodyEl=document.getElementById('body');
function buildRail(){
  modsEl.innerHTML='';
  MODULES.forEach((m,i)=>{ const b=document.createElement('button'); b.className='mod'+(m===current?' on':''); b.dataset.k=m.key; b.innerHTML=`<span class="n">${i+1}</span><span>${mN(m.key)}</span><span class="badge"></span>`; b.onclick=()=>{ stopTour(); openModule(m.key); }; modsEl.appendChild(b); });
}
function applyStatic(){
  document.documentElement.lang=LANG; document.documentElement.dir=AR()?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  document.getElementById('brandName').textContent=AR()?CFG.brandAr:CFG.brand;
  document.getElementById('plantName').textContent=AR()?CFG.plantAr:CFG.plant;
  document.getElementById('langBtn').textContent=t('langBtn');
  document.getElementById('tourBtn').textContent=tourT?t('stop'):t('tour');
  document.title=AR()?`${CFG.brandAr} · التوأم الرقمي للمصنع`:`${CFG.brand} Factory Twin`;
  buildRail();
}
let lastHTML='', holdRender=false, pendingRender=false;
function renderPanel(){
  const i=MODULES.indexOf(current);
  document.getElementById('pEy').textContent=t('moduleOf',i+1);
  document.getElementById('pTitle').textContent=mN(current.key);
  document.getElementById('pSub').textContent=mS(current.key);
  const html=PANELS[current.key]();
  if(html===lastHTML) return;
  if(holdRender){ pendingRender=true; return; }   // don't swap buttons out from under the cursor
  lastHTML=html; const st=bodyEl.scrollTop; bodyEl.innerHTML=html; bodyEl.scrollTop=st;
}
bodyEl.addEventListener('pointerover',e=>{ if(e.target.closest('[data-act],[data-mod]')) holdRender=true; });
bodyEl.addEventListener('pointerout',e=>{ if(e.target.closest('[data-act],[data-mod]') && !e.relatedTarget?.closest?.('[data-act],[data-mod]')){ holdRender=false; if(pendingRender){ pendingRender=false; renderPanel(); } } });
bodyEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(b){ ACT[b.dataset.act](b.dataset.arg); holdRender=false; onTick(); return; }
  const r=e.target.closest('[data-mod]'); if(r) openModule(r.dataset.mod);
});
function openModule(key){
  const m=MODULES.find(m=>m.key===key); const changed=m!==current; current=m;
  const i=MODULES.indexOf(m);
  [...modsEl.children].forEach(b=>b.classList.toggle('on',b.dataset.k===key));
  document.getElementById('chN').textContent=i+1; document.getElementById('chT').textContent=mN(m.key);
  gsap.fromTo('#chapter',{y:-8,opacity:0},{y:0,opacity:1,duration:.4,ease:'power3.out'});
  if(changed){ bodyEl.scrollTop=0; lastHTML=''; holdRender=false; }
  renderPanel(); buildLabels();
  if(changed) gsap.fromTo(bodyEl.children,{opacity:0,y:10},{opacity:1,y:0,duration:.45,stagger:.04,ease:'power3.out'});
  const [x,z,zoom]=m.cam;
  gsap.to(rig,{x,z,zoom,duration:1.6,ease:'power3.inOut',overwrite:true});
  if(key==='reports'){ renderBrief(); briefEl.style.display='block'; document.getElementById('chapter').style.display='none'; if(changed) gsap.fromTo(briefEl,{opacity:0,y:-12},{opacity:1,y:0,duration:.6,delay:.9,ease:'power3.out'}); }
  else { briefEl.style.display='none'; document.getElementById('chapter').style.display='flex'; }
}
function updateTop(){
  document.getElementById('clock').textContent=clockStr(S.h);
  document.getElementById('kOee').textContent=oee().toFixed(1)+'%';
  document.getElementById('kCash').textContent=money(S.fin.cash);
  document.getElementById('kDue').textContent=S.orders.filter(o=>o.status!=='delivered'&&o.status!=='shipped'&&o.dueH-S.h<24).length;
  let tot=0; [...modsEl.children].forEach(b=>{ const a=alertsFor(b.dataset.k); tot+=a; b.querySelector('.badge').textContent=a||''; });
  document.getElementById('kAlerts').textContent=tot;
}
document.getElementById('kAlertsBox').onclick=()=>openModule('reports');
function onTick(){ sync3D(); updateTop(); renderPanel(); buildLabels(); if(current.key==='reports') renderBrief(); }

function setLang(l){
  LANG=l; try{ localStorage.setItem('twin-lang',l); }catch(e){}
  applyStatic(); lastHTML=''; holdRender=false;
  labelPool.forEach(p=>p.html='');
  openModule(current.key); updateTop();
}
document.getElementById('langBtn').onclick=()=>setLang(AR()?'en':'ar');

let tickTimer=null;
function setSpeed(s){ S.speed=s; [...document.querySelectorAll('#speed button')].forEach(b=>b.classList.toggle('on',+b.dataset.s===s)); clearInterval(tickTimer); if(s>0) tickTimer=setInterval(tick,1800/s); }
document.querySelectorAll('#speed button').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.s));
const autoTog=document.getElementById('autoTog');
document.getElementById('autoRow').onclick=()=>{ S.auto=!S.auto; autoTog.classList.toggle('on',S.auto); toast(S.auto?t('autoOn'):t('autoOff'),'ok'); };
document.getElementById('resetBtn').onclick=()=>{ Object.values(inTrucks).forEach(x=>scene.remove(x)); Object.values(outTrucks).forEach(x=>scene.remove(x)); for(const k in inTrucks) delete inTrucks[k]; for(const k in outTrucks) delete outTrucks[k]; initState(); autoTog.classList.add('on'); lastHTML=''; onTick(); toast(t('resetDone'),'ok'); };
let tourT=null; const tourBtn=document.getElementById('tourBtn');
function stopTour(){ if(tourT){ clearInterval(tourT); tourT=null; tourBtn.textContent=t('tour'); } }
tourBtn.onclick=()=>{ if(tourT){ stopTour(); return; } let i=0; openModule(MODULES[0].key); tourT=setInterval(()=>{ i++; if(i>=MODULES.length){ stopTour(); return; } openModule(MODULES[i].key); },6500); tourBtn.textContent=t('stop'); };

/* =====================================================================
   CAMERA + RENDER LOOP
   ===================================================================== */
const rig={x:0,z:-6,zoom:0.3,az:45,el:35};
const _r=new THREE.Vector3(),_u=new THREE.Vector3();
function placeCamera(){
  const az=THREE.MathUtils.degToRad(rig.az), el=THREE.MathUtils.degToRad(rig.el), D=300;
  cam.position.set(rig.x+Math.sin(az)*Math.cos(el)*D, Math.sin(el)*D, rig.z+Math.cos(az)*Math.cos(el)*D);
  const fz = innerWidth>900
    ? Math.max(0.42, Math.min(1.1, (innerWidth-680)/760)) * Math.min(1.1, innerHeight/820)
    : Math.max(0.5, Math.min(1, innerWidth/520));
  const z=rig.zoom*fz;
  cam.lookAt(rig.x,0,rig.z); cam.zoom=z; cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  // keep the focus centred in the free area between rail and panel (mirrored in RTL)
  const wpp=(VIEW/z)/innerHeight; let dx=0, dy=0;
  if(innerWidth>900){ dx=(440-206)/2*(AR()?-1:1); dy=current.key==='reports'?Math.min(150,innerHeight*0.16):0; } else { dy=innerHeight*0.2; }
  _r.setFromMatrixColumn(cam.matrixWorld,0); _u.setFromMatrixColumn(cam.matrixWorld,1);
  cam.position.addScaledVector(_r,dx*wpp).addScaledVector(_u,dy*wpp); cam.updateMatrixWorld();
  sun.position.set(rig.x-70,140,rig.z+50); sun.target.position.set(rig.x,0,rig.z);
}
const clk=new THREE.Clock(); let TT=0;
function frame(){
  const dt=Math.min(clk.getDelta(),.05); TT+=dt;
  placeCamera();
  S.lines.forEach((l,li)=>{ const v=lineVis[li]; const sp=l.status==='run'?3:l.status==='slow'?1.6:0; v.off=(v.off+sp*dt)%4;
    v.items.forEach((b,i)=>{ b.position.x=-26+((i*4+v.off)%52); });
    v.ms.forEach((m,mi)=>{ m.lb.visible=!m.blink||Math.sin(TT*8)>-0.2; m.g.position.y=sp>0?Math.max(0,Math.sin(TT*10+mi))*0.04:0; }); });
  for(const id in inTrucks){ const p=S.pos.find(p=>p.id===id); if(!p) continue; const tk=inTrucks[id]; const {path,d}=poDist(p);
    if(tk.userData.d<0) tk.userData.d=d; tk.userData.d+=(d-tk.userData.d)*Math.min(1,dt*2); const q=path.at(tk.userData.d);
    tk.position.set(q.x,0,q.z); tk.userData.ang=lerpAng(tk.userData.ang,q.ang,.15); tk.rotation.y=tk.userData.ang; tk.scale.setScalar(.8); }
  for(const id in outTrucks){ const s=S.ships.find(s=>s.id===id); if(!s) continue; const tk=outTrucks[id]; const path=s.region==='east'?eastPath:southPath; const d=s.progress*path.total;
    if(tk.userData.d<0) tk.userData.d=0; tk.userData.d+=(d-tk.userData.d)*Math.min(1,dt*2); const q=path.at(tk.userData.d);
    tk.position.set(q.x,0,q.z); tk.userData.ang=lerpAng(tk.userData.ang,q.ang,.15); tk.rotation.y=tk.userData.ang; }
  qcSlots.forEach(s=>{ s.top.scale.y=(s.lot&&s.lot.status==='pending')?0.85+Math.sin(TT*4)*0.15:1; });
  const hod=S.h%24, busy=[5,6,13,14,21,22].includes(hod);
  people.forEach((p,i)=>{ const u=p.userData; if(i>(busy?39:8)){ p.visible=false; return; } p.visible=true; u.t=(u.t+u.sp*dt*(busy?1.6:1))%1;
    const a=new THREE.Vector3(-70+u.lane,0,44), b=new THREE.Vector3(-38,0,22+u.lane); p.position.lerpVectors(a,b,u.t); p.rotation.y=Math.atan2(-(b.z-a.z),b.x-a.x)-Math.PI/2; });
  placeLabels(); drawLinks();
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}

/* =====================================================================
   BOOT
   ===================================================================== */
initState();
applyStatic();
sync3D(); updateTop();
openModule('manufacturing');
rig.zoom=0.3;
gsap.to(rig,{zoom:MODULES[0].cam[2],duration:2.2,ease:'power3.inOut',delay:.3});
setSpeed(1);
{ const ld=document.getElementById('loader'); setTimeout(()=>{ ld.style.opacity=0; setTimeout(()=>ld.remove(),700); },400); }
requestAnimationFrame(()=>{ frame();
  gsap.from('#top',{y:-60,duration:.8,ease:'power3.out',delay:.2}); gsap.from('#rail',{opacity:0,duration:.8,ease:'power3.out',delay:.5}); gsap.from('#panel',{opacity:0,duration:.8,ease:'power3.out',delay:.6}); });
setTimeout(()=>toast(t('tip'),'ok'),2500);
</script>
